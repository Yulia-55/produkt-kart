<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Card</title>  
  <link rel="stylesheet" href="style/style.css">
  <link rel="stylesheet" href="style/buttons.css">
  <link rel="stylesheet" href="style/clear-list.css">
  <link rel="stylesheet" href="style/catalog.css">
  <link rel="stylesheet" href="style/composition.css">
  <link rel="stylesheet" href="style/card.css">
  <link rel="stylesheet" href="style/products.css">
</head>
<body>
  <main class="catalog">
    <div class="catalog__container container">
      <div class="buttons">
        <button id="change-color-all-cards" class="buttons__button">Изменить цвет всех карточек</button>
        <button id="change-color-firstcard" class="buttons__button">Изменить цвет первой карточки</button>
        <button id="open-google" class="buttons__button">Открыть Google</button>
        <button id="outputConsoleLog" class="buttons__button">Вывести в консоль</button>
        <button id="change-color-background-button" class="buttons__button">Изменить цвет фона</button>
      </div>
      <h1 class="catalog__title title">Выбери свой продукт</h1>
      <ul class="products clear-list">
        <template class="card-template">
          <li class="products__item card">
            <img src="img/photo_1.png" alt="Product 1" class="card__image" />
            <span class="card__remark"></span>
            <h2 class="card__name"></h2>
            <div class="card__description">
              <p class="card__description-text"></p>
            </div>
            <div class="card__composition composition">
              <span class="composition__title">Состав:</span>
              <ul class="composition__list">                
              </ul>
            </div>
            <div class="card__price">
              <b>Цена</b>
              <span class="card__price-value"></span>
            </div>
          </li>
        </template>       
      </ul>
    </div>
  </main>
  <script src="script.js"></script>
  <script src="homework-7.js"></script>
  <script src="homework-8.js"></script>
  <script type="module" src="homework-10.js"></script>
</body>
</html>
